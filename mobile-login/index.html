<!doctype html>
<!--
  Страница входа ESHArio для iPhone (кирпич MOBILE-IOS-1, бриф MOBILE-FINAL-1
  этап 5). Своего скрипта у страницы нет: форму обслуживает юзерскрипт
  ESHArio (режим login в mobile/host/host.js), пароль уходит его фону и дальше
  только в api. У полей нет name: если юзерскрипт не встал, обычная отправка
  формы не унесёт ни почты, ни пароля.
  Вид окна аккаунта ПК (src/account/options.css, кнопка канона из
  src/ui/controls.css), цвета токенами темы с теми же значениями, что в
  src/ui/theme.css (сцена-близнец сверяет), знак ESHArio картинкой (DESIGN,
  правило 8). Под палец: поля 16 px (Safari не приближает), кнопки 44 px.
  Слова из окна аккаунта ПК (src/_locales, ключи account*), новых нет.
  На стенде раздаётся с компьютера брата; боевую страницу кладёт вкладка
  владельца (SITE-MOBILE-LOGIN-1).
  LPW1 начало
  ДОПИСКА LOGIN-PASSWORD-WORD-1 (24.10, F269): строки «своего скрипта нет» и
  «новых слов нет» выше больше не правда. Короткая попытка пишет под паролем
  наше предложение вместо немой проверки браузера (кадр человека: около 9
  точек, «Войти» не нажимается). Серой подписи «не короче 12 знаков» под полем
  нет по слову владельца на листе 24.10: «нафиг этот мусор нужен когда у нас
  красным все равно светится». Свой скрипт внизу страницы делает только это: глушит пузырь
  браузера у пароля, считает знаки и не пускает короткий пароль к
  юзерскрипту. Число одно: `minlength` поля, его сверяет сцена с
  `PASSWORD_MIN` сервера (`tests/site-mobile-login-password.test.mjs`).
  Всё добавленное стоит между строками «LPW1 начало» и «LPW1 конец»: без них
  страница байт в байт файл брата `mobile/host/login.html` 9a40d42.
  LPW1 конец
-->

    --fx-ink: #EEF1F7;
    --fx-dim: #939DB4;
    color-scheme: dark;
    font: 16px/1.45 system-ui, -apple-system, sans-serif;
    background: var(--fx-surface);
    color: var(--fx-ink);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fx-surface); }
  main { max-width: 420px; margin: 0 auto; padding: 20px 16px 32px; }
  h1 { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 20px; }
  h1 img { height: 26px; }

  label { display: block; margin: 0 0 12px; }
  label span { display: block; margin: 0 0 6px; color: var(--fx-dim); font-size: 15px; }
  input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--fx-line-strong); border-radius: 6px;
    background: var(--fx-surface-sunken); color: var(--fx-ink); font: inherit; font-size: 16px; }
  input:focus { outline: 2px solid var(--fx-accent); outline-offset: 1px; }
  button { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--fx-line-strong); border-radius: 6px;
    background: var(--fx-surface-2); color: var(--fx-ink); font: inherit; font-weight: 600; cursor: pointer; }
  #login-submit { border-color: var(--fx-accent); background: var(--fx-accent); color: var(--fx-on-accent); }
  #logout { border-color: var(--fx-danger); background: none; color: var(--fx-danger); }
  section { padding: 0; border: 0; background: none; }
  p[data-word] { padding: 12px 14px; }
  p[data-word="wait"] { color: var(--fx-dim); }
  p[data-word="premium"] { border-color: var(--fx-ok); color: var(--fx-ok); }
  p[data-word="network"] { border-color: var(--fx-warn); color: var(--fx-warn); }
  p[data-word="error"] { border-color: var(--fx-danger); color: var(--fx-danger); }
  [hidden] { display: none !important; }
  /* LPW1 начало */
  .pw-short { margin: -6px 0 12px; color: var(--fx-danger); font-size: 15px; }
  /* LPW1 конец */
</style>
</head>

  <form id="login" autocomplete="on" hidden>
    <label><span>Почта</span><input id="email" type="email" autocomplete="username" required></label>

<script>
// Короткий пароль не уходит юзерскрипту и не молчит: пузырь браузера погашен,
// под полем наше предложение со счётом знаков. Слушатель отправки стоит на
// документе в фазе захвата, поэтому он первый при любом порядке, в каком встал
// юзерскрипт; длинный пароль идёт дальше как прежде.
(function(){var form=document.getElementById('login'),password=document.getElementById('password'),word=document.getElementById('password-short');
if(!form||!password||!word)return;
var need=password.minLength>0?password.minLength:12;
var tail=' Это пароль из письма ESHArio, не пароль EA.';
function signs(n){var a=n%10,b=n%100;return a===1&&b!==11?'знак':a>=2&&a<=4&&(b<12||b>14)?'знака':'знаков'}
function short(){return password.value.length<need}
function say(){var n=password.value.length;
word.textContent=(n===0?'Введите пароль ESHArio, в нём не меньше '+need+' '+signs(need)+'.':'В пароле '+n+' '+signs(n)+', а нужно не меньше '+need+'.')+tail;
word.hidden=false;
try{password.focus()}catch(err){}}
password.addEventListener('invalid',function(event){event.preventDefault();say()});
document.addEventListener('submit',function(event){if(event.target!==form||!short())return;
event.preventDefault();event.stopImmediatePropagation();say()},true);
password.addEventListener('input',function(){word.hidden=true})})();
</script>
<!-- LPW1 конец -->
